name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.0, which the runner's
      # default toolchain does not always provide.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Report toolchain
        run: swift --version

      - name: Test
        run: swift test --disable-sandbox

      - name: Package
        run: scripts/package-dmg.sh

      - name: Validate app bundle
        run: |
          codesign --verify --deep --strict dist/RelayMate.app
          plutil -lint dist/RelayMate.app/Contents/Info.plist
          file dist/RelayMate.app/Contents/MacOS/RelaySetup
          hdiutil verify dist/RelayMate.dmg
          cd dist
          shasum -a 256 -c RelayMate.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RelayMate-macOS
          path: |
            dist/RelayMate.dmg
            dist/RelayMate.dmg.sha256
          if-no-files-found: error

  windows-x86:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Windows core
        run: dotnet run --project windows/RelayMate.Core.Tests/RelayMate.Core.Tests.csproj --configuration Release

      - name: Package Windows x86
        shell: pwsh
        run: scripts/package-windows.ps1 -Architecture x86

      - uses: actions/upload-artifact@v4
        with:
          name: RelayMate-Windows-x86
          path: |
            dist/RelayMate-Windows-x86.exe
            dist/RelayMate-Windows-x86.exe.sha256
            dist/RelayMate-Windows-x86.zip
            dist/RelayMate-Windows-x86.zip.sha256
          if-no-files-found: error
